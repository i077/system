name: Build rescue ISOs

on:
  push:
    branches: [master]
    paths:
      - flake.lock
      - packages/rescue-iso.nix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
            target: packages.x86_64-linux.rescue-iso

          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
            target: packages.aarch64-linux.rescue-iso

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build ${{ matrix.target }}
        run: nix build ".#${{ matrix.target }}" -L

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: rescue-iso-${{ matrix.system }}
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 7
