name: Build hosts & devshells

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runs-on: macos-26
            target: devShells.aarch64-darwin.default

          - system: aarch64-darwin
            runs-on: macos-26
            target: packages.aarch64-darwin.ci-hosts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: i077
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.target }}
        run: nix build ".#${{ matrix.target }}" --no-link -L
